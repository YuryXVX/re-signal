<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>re-signal — native DOM</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        --bg: #e8eef2;
        --ink: #14212b;
        --accent: #0b6e4f;
        --line: #b7c4ce;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, #d5e6df 0%, transparent 45%),
          radial-gradient(circle at 80% 70%, #c9d7e4 0%, transparent 40%),
          var(--bg);
        color: var(--ink);
      }

      main {
        width: min(420px, calc(100vw - 2rem));
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 1.25rem;
        color: #3d4f5c;
      }

      .row {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }

      button {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 0.55rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      #count {
        font-variant-numeric: tabular-nums;
        font-size: 2rem;
        font-weight: 600;
        min-width: 3ch;
      }

      #parity {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: #3d4f5c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>re-signal</h1>
      <p>Нативный DOM без фреймворка: signal → effect → DOM.</p>
      <div class="row">
        <button type="button" id="dec">−</button>
        <span id="count">0</span>
        <button type="button" id="inc" class="primary">+</button>
        <button type="button" id="reset">reset</button>
      </div>
      <div id="parity">чётное</div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
